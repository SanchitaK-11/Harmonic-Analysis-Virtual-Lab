<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Harmonic Analysis Quiz</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(135deg,
          #0f1020,
          #17172f,
          #25164d,
          #34196b);

      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    /* Background Glow */

    .blur1,
    .blur2,
    .blur3 {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.45;
    }

    .blur1 {
      width: 320px;
      height: 320px;
      background: #7c3aed;
      top: -100px;
      left: -80px;
    }

    .blur2 {
      width: 320px;
      height: 320px;
      background: #3b82f6;
      bottom: -100px;
      right: -80px;
    }

    .blur3 {
      width: 250px;
      height: 250px;
      background: #ec4899;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Main Container */

    .main-container {
      width: 100%;
      max-width: 1100px;
      position: relative;
      z-index: 10;
      text-align: center;
    }

    /* Heading */

    .title {
      font-size: 3.3rem;
      color: white;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .subtitle {
      color: #dcdcff;
      font-size: 1.1rem;
      margin-bottom: 55px;
    }

    /* Cards */

    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 35px;
    }

    .quiz-card {
      position: relative;
      padding: 42px 30px;
      border-radius: 30px;

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);

      backdrop-filter: blur(15px);

      overflow: hidden;
      cursor: pointer;

      transition: 0.4s ease;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .quiz-card:hover {
      transform: translateY(-12px) scale(1.03);

      box-shadow:
        0 15px 40px rgba(124, 58, 237, 0.35);
    }

    .quiz-card::before {
      content: '';
      position: absolute;

      width: 220px;
      height: 220px;

      border-radius: 50%;

      top: -90px;
      right: -90px;

      background: rgba(255, 255, 255, 0.05);
    }

    /* Individual Card Colors */

    .level1 {
      border-top: 4px solid #8b5cf6;
    }

    .level2 {
      border-top: 4px solid #ec4899;
    }

    /* Icons */

    .icon {
      font-size: 4rem;
      margin-bottom: 22px;

      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.3));
    }

    /* Card Text */

    .quiz-card h2 {
      color: white;
      font-size: 2rem;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .quiz-card p {
      color: #ececff;
      line-height: 1.7;
      margin-bottom: 30px;
      font-size: 1rem;
    }

    /* Buttons */

    .btn {
      display: inline-block;
      padding: 13px 30px;
      border-radius: 50px;

      text-decoration: none;
      color: white;

      font-weight: 600;
      font-size: 0.95rem;

      transition: 0.3s ease;
    }

    .level1 .btn {
      background: linear-gradient(135deg,
          #7c3aed,
          #3b82f6);
    }

    .level2 .btn {
      background: linear-gradient(135deg,
          #ec4899,
          #8b5cf6);
    }

    .btn:hover {
      transform: scale(1.08);

      box-shadow:
        0 0 20px rgba(255, 255, 255, 0.25);
    }

    /* Responsive */

    @media(max-width:768px) {

      .title {
        font-size: 2.4rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      .quiz-card {
        padding: 35px 25px;
      }

    }
  </style>
</head>

<body>

  <!-- Background Glow -->
  <div class="blur1"></div>
  <div class="blur2"></div>
  <div class="blur3"></div>

  <!-- Main Content -->
  <div class="main-container">

    <h1 class="title">
      Harmonic Analysis Quiz
    </h1>

    <p class="subtitle">
      Choose your level and test your Harmonic Analysis skills
    </p>

    <!-- Quiz Cards -->
    <div class="quiz-grid">

      <!-- LEVEL 1 -->
      <div class="quiz-card level1"
        onclick="openQuiz('level1.html')">

        <div class="icon">📝</div>

        <h2>Level 1 Quiz</h2>

        <p>
          Practice theoretical concepts,
          formulas and basic Fourier Series
          questions.
        </p>

        <a href="level1.html"
          target="_blank"
          class="btn">
          Start Quiz
        </a>

      </div>

      <!-- LEVEL 2 -->
      <div class="quiz-card level2"
        onclick="openQuiz('level2.html')">

        <div class="icon">📝</div>

        <h2>Level 2 Quiz</h2>

        <p>
          Solve advanced numerical problems,
          harmonics and Fourier coefficient
          calculations.
        </p>

        <a href="level2.html"
          target="_blank"
          class="btn">
          Start Quiz
        </a>

      </div>

    </div>

  </div>

  <script>

    function openQuiz(page) {
      window.open(page, "_blank");
    }

  </script>

</body>

</html>
